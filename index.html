<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v1-tts</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #008080;
    font: 11px Tahoma, "MS Sans Serif", sans-serif;
    padding: 16px;
  }
  .window {
    width: 100%;
    max-width: 420px;
    background: #c0c0c0;
    border: 1px solid #000;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 rgba(0,0,0,.3);
    padding: 2px;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    padding: 3px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .titlebar .x {
    width: 16px; height: 14px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
    color: #000;
    font: bold 9px Tahoma, sans-serif;
    text-align: center;
    line-height: 12px;
  }
  .body { padding: 10px; }
  label { display: block; margin-bottom: 3px; }
  input[type=text] {
    width: 100%;
    padding: 3px 4px;
    font: inherit;
    background: #fff;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    outline: none;
  }
  .param {
    display: grid;
    grid-template-columns: 42px 1fr 28px;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  .param span:last-child { text-align: right; }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%; height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background: #808080;
    box-shadow: 0 1px 0 #fff;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 18px;
    margin-top: -7px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    background: #808080;
    box-shadow: 0 1px 0 #fff;
  }
  input[type=range]::-moz-range-thumb {
    width: 9px; height: 16px;
    border-radius: 0;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
  }
  .actions { margin-top: 12px; display: flex; gap: 6px; }
  button {
    font: inherit;
    padding: 4px 12px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    box-shadow: 1px 1px 0 #000;
  }
  button:active {
    border-color: #404040 #fff #fff #404040;
    box-shadow: none;
  }
  .statusbar {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 2px 6px;
  }
  .statusbar a { color: #000080; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar"><span>v1-tts</span><span class="x">×</span></div>
  <div class="body">

    <label for="text">Text</label>
    <input type="text" id="text" value="Hello, world." spellcheck="false" autocomplete="off">

    <div class="param"><span>pitch</span>  <input type="range" id="pitch"  min="0" max="255" value="64">  <span id="pitch-v">64</span></div>
    <div class="param"><span>speed</span>  <input type="range" id="speed"  min="1" max="255" value="72">  <span id="speed-v">72</span></div>
    <div class="param"><span>mouth</span>  <input type="range" id="mouth"  min="0" max="255" value="128"> <span id="mouth-v">128</span></div>
    <div class="param"><span>throat</span> <input type="range" id="throat" min="0" max="255" value="128"> <span id="throat-v">128</span></div>

    <div class="actions">
      <button id="speak" type="button">Speak</button>
      <button id="download" type="button">Download WAV</button>
    </div>

    <div class="statusbar">
      <span id="status">Ready</span>
      <a href="https://github.com/flexiy0/v1-tts">source</a>
    </div>

  </div>
</div>

<script src="dist/samjs.js"></script>
<script>
(function () {
  'use strict';

  var opts = { pitch: 64, speed: 72, mouth: 128, throat: 128 };
  var $ = function (id) { return document.getElementById(id); };

  // Cyrillic is mapped straight to synthesizer phonemes instead of going
  // through the English text rules, which mispronounce transliterations.
  // A word-level pass approximates Russian phonology: stress placement,
  // vowel reduction, /j/ glides, final devoicing and common orthographic
  // exceptions — without it the output is flat and unintelligible.
  var CONS = {
    'б':'B','в':'V','г':'G','д':'D','ж':'ZH','з':'Z','й':'Y','к':'K',
    'л':'L','м':'M','н':'N','п':'P','р':'R','с':'S','т':'T','ф':'F',
    'х':'/H','ц':'TS','ч':'CH','ш':'SH','щ':'SH'
  };
  var VOWELS = 'аеёиоуыэюя';
  var FIX = { 'что':'што', 'чтобы':'штобы', 'сегодня':'севодня', 'конечно':'канешна' };

  function ruWord(word) {
    word = FIX[word] || word;
    var genitive = /([ое])го$/.test(word);
    word = word
      .replace(/([ое])го$/, '$1во')   // -ого/-его endings sound as -ово/-ево
      .replace(/ть?ся$/, 'ца')        // -тся/-ться reflexives sound as -ца
      .replace(/б$/,'п').replace(/в$/,'ф').replace(/г$/,'к')  // final
      .replace(/д$/,'т').replace(/ж$/,'ш').replace(/з$/,'с'); // devoicing

    var ch = word.split('');
    var vPos = [];
    ch.forEach(function (c, i) { if (VOWELS.indexOf(c) >= 0) vPos.push(i); });

    // Stress: 'ё' is always stressed; genitive endings stress the final
    // vowel; otherwise fall back to the penultimate vowel, the single
    // most common position. Wrong stress still beats no stress.
    var stressAt = -1;
    if (word.indexOf('ё') >= 0) stressAt = word.indexOf('ё');
    else if (genitive && vPos.length) stressAt = vPos[vPos.length - 1];
    else if (vPos.length === 1) stressAt = vPos[0];
    else if (vPos.length > 1) stressAt = vPos[vPos.length - 2];

    var out = '';
    ch.forEach(function (c, i) {
      var stressed = i === stressAt;
      var ph = '';
      switch (c) {
        case 'а': ph = 'AA'; break;
        case 'о': ph = stressed ? 'OH' : 'AH'; break;  // unstressed о → а
        case 'е': ph = stressed ? 'YEH' : 'YIH'; break; // unstressed е → и
        case 'ё': ph = 'YOH'; break;
        case 'и': ph = 'IY'; break;
        case 'ы': ph = 'IH'; break;
        case 'у': ph = 'UW'; break;
        case 'э': ph = 'EH'; break;
        case 'ю': ph = 'YUW'; break;
        case 'я': ph = stressed ? 'YAA' : 'YAH'; break;
        case 'ь': ph = 'ао'.indexOf(ch[i + 1]) >= 0 ? 'Y' : ''; break;
        case 'ъ': ph = ''; break;
        default: ph = CONS[c] || '';
      }
      if (!ph) return;
      if (VOWELS.indexOf(c) >= 0) ph += stressed ? '4' : '6';
      out += ph;
    });
    return out;
  }

  function toPhonemes(text) {
    // Latin words go through the built-in reciter; Cyrillic words through
    // ruWord. Only " . ? , -" are valid phonetic punctuation.
    return text.split(/([A-Za-z']+)/).map(function (seg) {
      if (!seg) return '';
      if (/[A-Za-z]/.test(seg)) {
        var conv = SamJs.convert(seg);
        return typeof conv === 'string' ? conv : '';
      }
      return seg.toLowerCase()
        .replace(/[0-9]+/g, ' ')
        .replace(/[а-яё]+/g, ruWord)
        .replace(/[!;:]/g, '.')
        .replace(/[^A-Z0-9 .,?\/-]/g, ' ');
    }).join(' ');
  }

  function prepare(text) {
    if (/[а-яёА-ЯЁ]/.test(text)) return { text: toPhonemes(text), phonetic: true };
    return { text: text, phonetic: false };
  }

  // The synthesizer has a ~256-entry phoneme buffer; long input overflows it
  // and intonation degrades into mush. Feed it one phrase at a time instead.
  var MAX = 80;
  function splitText(text) {
    var out = [];
    var sentences = text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]*\s*/g) || [text];
    sentences.forEach(function (s) {
      s = s.trim();
      while (s.length > MAX) {
        var cut = s.lastIndexOf(',', MAX);
        if (cut < MAX * 0.4) cut = s.lastIndexOf(' ', MAX);
        if (cut <= 0) cut = MAX;
        out.push(s.slice(0, cut + 1).trim());
        s = s.slice(cut + 1).trim();
      }
      if (s) out.push(s);
    });
    return out;
  }

  var RATE = 22050;
  var GAP = Math.round(RATE * 0.28); // inter-phrase silence, samples

  function renderChunks(chunks) {
    var sam = new SamJs(opts);
    return chunks.map(function (c) {
      var req = prepare(c);
      var b = sam.buf8(req.text, req.phonetic);
      if (!(b instanceof Uint8Array)) throw new Error('synthesis failed');
      return b;
    });
  }

  function downloadWav(bufs) {
    var total = bufs.reduce(function (n, b) { return n + b.length; }, 0) + GAP * (bufs.length - 1);
    var wav = new Uint8Array(44 + total);
    var v = new DataView(wav.buffer);
    var ascii = function (off, s) { for (var i = 0; i < s.length; i++) wav[off + i] = s.charCodeAt(i); };
    ascii(0, 'RIFF');  v.setUint32(4, 36 + total, true);
    ascii(8, 'WAVE');  ascii(12, 'fmt ');
    v.setUint32(16, 16, true);   v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, RATE, true); v.setUint32(28, RATE, true);
    v.setUint16(32, 1, true);    v.setUint16(34, 8, true);
    ascii(36, 'data'); v.setUint32(40, total, true);
    wav.fill(128, 44); // 8-bit unsigned silence
    var pos = 44;
    bufs.forEach(function (b) { wav.set(b, pos); pos += b.length + GAP; });
    var url = URL.createObjectURL(new Blob([wav], { type: 'audio/vnd.wave' }));
    var a = document.createElement('a');
    a.href = url;
    a.download = 'v1-tts.wav';
    a.click();
    URL.revokeObjectURL(url);
  }

  function status(msg) { $('status').textContent = msg; }

  Object.keys(opts).forEach(function (p) {
    $(p).addEventListener('input', function (e) {
      opts[p] = +e.target.value;
      $(p + '-v').textContent = e.target.value;
    });
  });

  var playToken = 0;

  $('speak').addEventListener('click', function () {
    var token = ++playToken;
    var chunks = splitText($('text').value);
    if (!chunks.length) { status('Ready'); return; }
    var sam = new SamJs(opts);
    var i = 0;
    (function next() {
      if (token !== playToken) return;
      if (i >= chunks.length) { status('Ready'); return; }
      status(chunks.length > 1 ? 'Playing ' + (i + 1) + '/' + chunks.length : 'Playing');
      var req = prepare(chunks[i++]);
      var p;
      try { p = sam.speak(req.text, req.phonetic); } catch (e) { status('Synthesis failed'); return; }
      if (p && typeof p.then === 'function') {
        p.then(function () { setTimeout(next, 280); }, function () { status('Synthesis failed'); });
      } else {
        next();
      }
    })();
  });

  $('download').addEventListener('click', function () {
    playToken++;
    var chunks = splitText($('text').value);
    if (!chunks.length) { status('Ready'); return; }
    status('Rendering');
    try {
      downloadWav(renderChunks(chunks));
      status('Ready');
    } catch (e) { status('Synthesis failed'); }
  });
})();
</script>
</body>
</html>
