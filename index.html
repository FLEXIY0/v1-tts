<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v1-tts</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #008080;
    font: 11px Tahoma, "MS Sans Serif", sans-serif;
    padding: 16px;
  }
  .window {
    width: 100%;
    max-width: 460px;
    background: #c0c0c0;
    border: 1px solid #000;
    box-shadow: inset 1px 1px 0 #dfdfdf, inset -1px -1px 0 #808080, 2px 2px 0 rgba(0,0,0,.3);
    padding: 2px;
  }
  .titlebar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    padding: 3px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }
  .titlebar .x {
    width: 16px; height: 14px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
    color: #000;
    font: bold 9px Tahoma, sans-serif;
    text-align: center;
    line-height: 12px;
  }
  .body { padding: 10px; }
  label { display: block; margin-bottom: 3px; }
  textarea {
    width: 100%;
    height: 90px;
    padding: 3px 4px;
    font: inherit;
    background: #fff;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    outline: none;
    resize: vertical;
  }
  .row {
    display: grid;
    grid-template-columns: 42px 1fr 34px;
    gap: 8px;
    align-items: center;
    margin-top: 8px;
  }
  .row span:last-child { text-align: right; }
  select {
    font: inherit;
    background: #fff;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 2px;
    grid-column: 2 / 4;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%; height: 18px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px;
    background: #808080;
    box-shadow: 0 1px 0 #fff;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 18px;
    margin-top: -7px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
  }
  input[type=range]::-moz-range-track {
    height: 4px;
    background: #808080;
    box-shadow: 0 1px 0 #fff;
  }
  input[type=range]::-moz-range-thumb {
    width: 9px; height: 16px;
    border-radius: 0;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #404040 #404040 #fff;
  }
  .actions { margin-top: 12px; display: flex; gap: 6px; }
  button {
    font: inherit;
    padding: 4px 12px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #404040 #404040 #fff;
    box-shadow: 1px 1px 0 #000;
  }
  button:active {
    border-color: #404040 #fff #fff #404040;
    box-shadow: none;
  }
  button:disabled { color: #808080; text-shadow: 1px 1px 0 #fff; }
  .statusbar {
    margin-top: 12px;
    display: flex;
    justify-content: space-between;
    border: 1px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 2px 6px;
  }
  .statusbar a { color: #000080; }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar"><span>v1-tts</span><span class="x">×</span></div>
  <div class="body">

    <label for="text">Text</label>
    <textarea id="text" spellcheck="false">Mankind is dead. Blood is fuel. Hell is full.</textarea>

    <div class="row">
      <span>voice</span>
      <select id="voice">
        <option value="espeak-v1">eSpeak — V1 (local, RU+EN)</option>
        <option value="espeak-en">eSpeak — English (local)</option>
        <option value="espeak-ru">eSpeak — Russian (local)</option>
        <option value="sam-v1">Microsoft Sam — V1 (200/180)</option>
        <option value="sam-v1-aggressive">Microsoft Sam — V1 aggressive (200/250)</option>
        <option value="sam-v1-dark">Microsoft Sam — V1 dark (90/130)</option>
        <option value="sam-plain">Microsoft Sam — plain (100/150)</option>
        <option value="auto">Piper — auto (by language)</option>
        <option value="ru_RU-irina-medium">Piper — Irina (Russian)</option>
        <option value="ru_RU-ruslan-medium">Piper — Ruslan (Russian)</option>
        <option value="ru_RU-denis-medium">Piper — Denis (Russian)</option>
        <option value="en_US-hfc_female-medium">Piper — HFC Female (English)</option>
        <option value="en_US-lessac-medium">Piper — Lessac (English)</option>
      </select>
    </div>

    <div class="row">
      <span>rate</span>
      <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
      <span id="rate-v">1.0</span>
    </div>

    <div class="row">
      <span>preset</span>
      <select id="preset">
        <option value="c64">C64 SAM grit</option>
        <option value="v1">Improved SAM (V1)</option>
        <option value="robot">Heavy robot</option>
        <option value="human">Human (clean)</option>
      </select>
    </div>

    <div class="row">
      <span>robot</span>
      <input type="range" id="robot" min="0" max="100" step="5" value="65">
      <span id="robot-v">65%</span>
    </div>

    <div class="actions">
      <button id="speak" type="button">Speak</button>
      <button id="stop" type="button">Stop</button>
      <button id="download" type="button">Download WAV</button>
    </div>

    <div class="statusbar">
      <span id="status">Ready</span>
      <a href="https://github.com/flexiy0/v1-tts">source</a>
    </div>

  </div>
</div>

<script type="module">
import * as tts from './dist/piper.js';

const $ = id => document.getElementById(id);
const state = { token: 0, audio: null, rate: 1, robot: 0.65, preset: null, session: null, voiceId: null, samProxyBad: false };

// Local engine: espeak-ng compiled to WASM (~18 MB, data embedded). A robotic
// formant synthesizer in the same family as Microsoft Sam — intelligible,
// native Russian and English, no server, no network. Loaded on first use.
const ESPEAK = {
  'espeak-v1': { lang: 'auto', pitch: 35, speed: 155 },
  'espeak-en': { lang: 'en-us', pitch: 40, speed: 160 },
  'espeak-ru': { lang: 'ru', pitch: 40, speed: 160 }
};
let espeakMod = null;
async function espeakWav(text, voice) {
  if (!espeakMod) {
    status('Loading voice engine');
    espeakMod = (await import('./dist/espeak/espeak-ng.js')).default;
  }
  const c = ESPEAK[voice];
  const lang = c.lang === 'auto' ? (/[а-яё]/i.test(text) ? 'ru' : 'en-us') : c.lang;
  const m = await espeakMod({
    arguments: ['-w', 'o.wav', '-v', lang, '-p', String(c.pitch), '-s', String(c.speed), text],
    print() {}, printErr() {}
  });
  return new Blob([m.FS.readFile('o.wav')], { type: 'audio/wav' });
}

// First use of a voice downloads its model (~60 MB) from HuggingFace;
// piper-tts-web caches it in OPFS, so subsequent runs are local.
// Runtime assets are pinned to the onnxruntime build bundled into piper.js
// (1.18.0) and the phonemizer the library targets; the voice model is the
// only thing fetched per-voice and cached in OPFS.
const WASM_PATHS = {
  onnxWasm: 'https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/',
  piperData: 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.data',
  piperWasm: 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.wasm'
};

function voiceFor(text) {
  const v = $('voice').value;
  if (v !== 'auto') return v;
  return /[а-яё]/i.test(text) ? 'ru_RU-irina-medium' : 'en_US-hfc_female-medium';
}

// The community "V1 voice" is Microsoft Sam (SAPI4) at pitch 200 / speed 180,
// served by tetyys.com. No CORS headers there, so we can't fetch()/decode the
// bytes — but a media element may load it cross-origin, which is all playback
// needs. Sam is an English formant synth, so Cyrillic is transliterated.
// Microsoft Sam (SAPI4) limits, from tetyys /VoiceLimitations?voice=Sam:
// pitch 50..200 (default 100), speed 30..450 (default 150). Requests outside
// these 400/503, so values are clamped before sending. The community "V1" is
// pitch 200 / speed 180; higher speed reads as aggressive, low pitch as dark.
const SAM_LIMITS = { pitch: [50, 200], speed: [30, 450] };
const SAM = {
  'sam-v1': { pitch: 200, speed: 180 },
  'sam-v1-aggressive': { pitch: 200, speed: 250 },
  'sam-v1-dark': { pitch: 90, speed: 130 },
  'sam-plain': { pitch: 100, speed: 150 }
};
const clamp = (v, [lo, hi]) => Math.max(lo, Math.min(hi, v));
// Optional self-hosted CORS proxy (see proxy/sam-proxy.js). Set once via
// ?proxy=<worker-url> and it is remembered. With a proxy the WAV bytes are
// readable, so Sam gets reliable playback plus a real stitched download;
// without one we fall back to direct tetyys playback via a media element.
const qp = new URLSearchParams(location.search).get('proxy');
if (qp !== null) localStorage.setItem('sam-proxy', qp);
const SAM_PROXY = (qp !== null ? qp : localStorage.getItem('sam-proxy') || '').trim();
const TRANSLIT = {
  'а':'a','б':'b','в':'v','г':'g','д':'d','е':'ye','ё':'yo','ж':'zh','з':'z',
  'и':'ee','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r',
  'с':'s','т':'t','у':'oo','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'sh',
  'ъ':'','ы':'i','ь':'','э':'e','ю':'yu','я':'ya'
};
function forSam(text) {
  return text.replace(/[а-яё]/gi, ch => {
    const lat = TRANSLIT[ch.toLowerCase()];
    return lat === undefined ? ch : (ch === ch.toLowerCase() ? lat : lat.toUpperCase());
  });
}
function samQuery(text, cfg) {
  return 'voice=Sam&pitch=' + clamp(cfg.pitch, SAM_LIMITS.pitch) +
    '&speed=' + clamp(cfg.speed, SAM_LIMITS.speed) +
    '&text=' + encodeURIComponent(forSam(text));
}
// Direct tetyys URL — playable in a media element from any origin.
function samDirect(text, cfg) {
  return 'https://www.tetyys.com/SAPI4/SAPI4?' + samQuery(text, cfg);
}
// Through the optional proxy — readable bytes for effects/stitched download.
function samProxied(text, cfg) {
  return SAM_PROXY + (SAM_PROXY.includes('?') ? '&' : '?') + samQuery(text, cfg);
}
async function samFetch(text, cfg) {
  const r = await fetch(samProxied(text, cfg));
  if (!r.ok) throw new Error('proxy ' + r.status);
  return await r.blob();
}
// Use the proxy only until it first fails (e.g. tetyys blocks the proxy's
// datacenter IPs); after that fall back to direct playback for the session.
function useProxy() { return SAM_PROXY && !state.samProxyBad; }

function status(msg) { $('status').textContent = msg; }

function onProgress(p) {
  if (p.total > 1e6) status(`Downloading voice ${Math.round(p.loaded / p.total * 100)}%`);
}

// The library keys a single session off a static field and does NOT reload
// the model when the voice changes, so switch voices by resetting it and
// building a fresh session. Same voice reuses the loaded model.
async function session(voiceId) {
  if (state.session && state.voiceId === voiceId) return state.session;
  tts.TtsSession._instance = null;
  status('Loading voice');
  const s = new tts.TtsSession({ voiceId, progress: onProgress, wasmPaths: WASM_PATHS });
  await s.waitReady;
  state.session = s;
  state.voiceId = voiceId;
  return s;
}

// Sentence-sized chunks keep time-to-first-audio low; the next chunk is
// synthesized while the current one plays.
function splitText(text, max) {
  const out = [];
  const sentences = text.replace(/\s+/g, ' ').match(/[^.!?…]+[.!?…]*\s*/g) || [text];
  for (let s of sentences) {
    s = s.trim();
    while (s.length > max) {
      let cut = s.lastIndexOf(',', max);
      if (cut < max * 0.4) cut = s.lastIndexOf(' ', max);
      if (cut <= 0) cut = max;
      out.push(s.slice(0, cut + 1).trim());
      s = s.slice(cut + 1).trim();
    }
    if (s) out.push(s);
  }
  return out;
}

// Give the clean neural voice a machine character without wrecking
// intelligibility: ring-modulate against a low carrier (small formant
// smear so words survive), add mild bit-crush grit, tame the top end,
// then crossfade against the dry voice by the 'robot' amount. 0 = human,
// 1 = full V1. Rendered offline so playback and download share one path.
let decodeCtx = null;
function crushCurve(bits) {
  const steps = 2 ** bits, n = 2048, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.round(x * steps) / steps;
  }
  return curve;
}
// Soft-clip drive: reedy, buzzy edge reminiscent of SAM's formant synthesis.
function driveCurve(k) {
  const n = 2048, curve = new Float32Array(n), a = 1 + k * 12;
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    curve[i] = Math.tanh(a * x) / Math.tanh(a);
  }
  return curve;
}

// preset = the timbre (character); the robot slider = how much of it to mix.
// Presets keep Piper's clarity underneath, so the machine flavour never
// makes the words unreadable — an intelligible take on the SAM/V1 sound.
// decimTo = sample-and-hold target rate (aliasing grit, the vintage buzz);
// gain = makeup drive toward SAM's hot, saturated level. Measured against the
// bundled C64 SAM: it runs ~3x louder (RMS .25 vs .08) and ~1.6x brighter in
// HF (.15 vs .09) and is 8-bit — the 'c64' preset reproduces exactly that.
const PRESETS = {
  human: { carrier: 0,  bits: 16, lp: 8000, drive: 0,    decimTo: 0,    gain: 1,   wet: 0    },
  v1:    { carrier: 62, bits: 7,  lp: 3200, drive: 0.35, decimTo: 0,    gain: 1,   wet: 0.55 }, // improved SAM
  c64:   { carrier: 0,  bits: 8,  lp: 7000, drive: 0.15, decimTo: 8000, gain: 1.3, wet: 1    }, // C64-SAM grit (metric-matched)
  robot: { carrier: 48, bits: 6,  lp: 2600, drive: 0.55, decimTo: 0,    gain: 1.2, wet: 0.85 }  // heavier machine
};
// Sample-and-hold decimation + makeup gain, applied to the rendered buffer.
function postProcess(buf, p) {
  const d = buf.getChannelData(0);
  if (p.decimTo) {
    const step = Math.max(1, Math.round(buf.sampleRate / p.decimTo));
    if (step > 1) for (let i = 0; i < d.length; i += step) {
      for (let j = 1; j < step && i + j < d.length; j++) d[i + j] = d[i];
    }
  }
  if (p.gain && p.gain !== 1) for (let i = 0; i < d.length; i++) {
    d[i] = Math.max(-1, Math.min(1, d[i] * p.gain));
  }
}
function encodeWav(buf) {
  const ch = buf.getChannelData(0), rate = buf.sampleRate;
  const out = new Uint8Array(44 + ch.length * 2), v = new DataView(out.buffer);
  const ascii = (o, s) => { for (let i = 0; i < s.length; i++) out[o + i] = s.charCodeAt(i); };
  ascii(0, 'RIFF'); v.setUint32(4, 36 + ch.length * 2, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ascii(36, 'data'); v.setUint32(40, ch.length * 2, true);
  let p = 44;
  for (let i = 0; i < ch.length; i++) {
    const s = Math.max(-1, Math.min(1, ch[i]));
    v.setInt16(p, s < 0 ? s * 32768 : s * 32767, true); p += 2;
  }
  return new Blob([out], { type: 'audio/wav' });
}
async function robotize(blob, amount) {
  const p = state.preset;
  const wet = p.wet * amount; // slider scales the preset's character
  if (wet <= 0) return blob;
  decodeCtx = decodeCtx || new (window.AudioContext || window.webkitAudioContext)();
  const decoded = await decodeCtx.decodeAudioData(await blob.arrayBuffer());
  const off = new OfflineAudioContext(1, decoded.length, decoded.sampleRate);
  const src = off.createBufferSource(); src.buffer = decoded;

  const dryG = off.createGain(); dryG.gain.value = 1 - wet;
  const wetG = off.createGain(); wetG.gain.value = wet * 1.1;

  // wet chain: drive -> [ring mod] -> bit-crush -> lowpass
  let node = src;
  if (p.drive > 0) {
    const drive = off.createWaveShaper(); drive.curve = driveCurve(p.drive);
    node.connect(drive); node = drive;
  }
  if (p.carrier > 0) {
    const ring = off.createGain(); ring.gain.value = 0;
    const carrier = off.createOscillator();
    carrier.type = 'sine'; carrier.frequency.value = p.carrier;
    carrier.connect(ring.gain); carrier.start();
    node.connect(ring); node = ring;
  }
  const crush = off.createWaveShaper(); crush.curve = crushCurve(p.bits);
  const lp = off.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = p.lp;
  node.connect(crush); crush.connect(lp);

  src.connect(dryG).connect(off.destination);
  lp.connect(wetG).connect(off.destination);

  src.start();
  const rendered = await off.startRendering();
  postProcess(rendered, p);
  return encodeWav(rendered);
}

function playUrl(url, revoke) {
  return new Promise((resolve, reject) => {
    const audio = new Audio(url);
    state.audio = audio;
    audio.playbackRate = state.rate;
    audio.preservesPitch = true;
    audio.onended = () => { if (revoke) URL.revokeObjectURL(url); resolve(); };
    audio.onerror = () => {
      if (revoke) URL.revokeObjectURL(url);
      const c = audio.error && audio.error.code;
      // code 4 = SRC_NOT_SUPPORTED/unreachable, 2 = network
      reject(new Error(c === 4 || c === 2 ? 'Sam service unreachable — try a Piper voice' : 'playback failed'));
    };
    audio.play().catch(e => reject(new Error(
      e && e.name === 'NotAllowedError' ? 'playback blocked by browser' : (e && e.message || 'playback failed')
    )));
  });
}
function play(blob) { return playUrl(URL.createObjectURL(blob), true); }

// Piper returns 16-bit mono WAVs of identical format, so concatenating the
// PCM bodies under one fresh header yields a single valid file.
async function stitch(blobs) {
  const bodies = [];
  let rate = 22050;
  for (const b of blobs) {
    const buf = new DataView(await b.arrayBuffer());
    rate = buf.getUint32(24, true);
    bodies.push(new Uint8Array(buf.buffer, 44));
  }
  const dataLen = bodies.reduce((n, a) => n + a.length, 0);
  const out = new Uint8Array(44 + dataLen);
  const v = new DataView(out.buffer);
  const ascii = (o, s) => { for (let i = 0; i < s.length; i++) out[o + i] = s.charCodeAt(i); };
  ascii(0, 'RIFF'); v.setUint32(4, 36 + dataLen, true); ascii(8, 'WAVE');
  ascii(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ascii(36, 'data'); v.setUint32(40, dataLen, true);
  let pos = 44;
  for (const a of bodies) { out.set(a, pos); pos += a.length; }
  return new Blob([out], { type: 'audio/wav' });
}

$('rate').addEventListener('input', e => {
  state.rate = +e.target.value;
  $('rate-v').textContent = state.rate.toFixed(1);
  if (state.audio) state.audio.playbackRate = state.rate;
});

state.preset = PRESETS[$('preset').value];
$('preset').addEventListener('change', e => { state.preset = PRESETS[e.target.value]; });

$('robot').addEventListener('input', e => {
  state.robot = +e.target.value / 100;
  $('robot-v').textContent = e.target.value + '%';
});

// The preset/robot effect only applies to Piper voices; Microsoft Sam is
// already the authentic V1, so grey those controls out when it's selected.
function syncControls() {
  const isSam = !!SAM[$('voice').value];
  $('preset').disabled = isSam;
  $('robot').disabled = isSam;
}
$('voice').addEventListener('change', syncControls);
syncControls();

$('speak').addEventListener('click', async () => {
  const token = ++state.token;
  const text = $('text').value.trim();
  if (!text) return;
  const chunks = splitText(text, 300);
  const voice = $('voice').value;
  const sam = SAM[voice];
  try {
    if (ESPEAK[voice]) {
      // Local engine: synth to a blob, apply the effect, play.
      for (let i = 0; i < chunks.length; i++) {
        const blob = await robotize(await espeakWav(chunks[i], voice), state.robot);
        if (token !== state.token) return;
        status(chunks.length > 1 ? `Playing ${i + 1}/${chunks.length}` : 'Playing');
        await play(blob);
        if (token !== state.token) return;
      }
      status('Ready');
      return;
    }
    if (sam) {
      for (let i = 0; i < chunks.length; i++) {
        status(chunks.length > 1 ? `Playing ${i + 1}/${chunks.length}` : 'Playing');
        // Prefer the proxy (readable bytes); on its first failure drop to
        // direct tetyys playback for the rest of the session.
        let played = false;
        if (useProxy()) {
          try { await play(await samFetch(chunks[i], sam)); played = true; }
          catch (e) { state.samProxyBad = true; }
        }
        if (!played) await playUrl(samDirect(chunks[i], sam), false);
        if (token !== state.token) return;
      }
      status('Ready');
      return;
    }
    const s = await session(voiceFor(text));
    if (token !== state.token) return;
    status('Synthesizing');
    let next = s.predict(chunks[0]);
    for (let i = 0; i < chunks.length; i++) {
      const blob = await robotize(await next, state.robot);
      if (token !== state.token) return;
      if (i + 1 < chunks.length) next = s.predict(chunks[i + 1]);
      status(chunks.length > 1 ? `Playing ${i + 1}/${chunks.length}` : 'Playing');
      await play(blob);
      if (token !== state.token) return;
    }
    status('Ready');
  } catch (e) {
    if (token === state.token) status('Error: ' + (e.message || e));
  }
});

$('stop').addEventListener('click', () => {
  state.token++;
  if (state.audio) state.audio.pause();
  status('Ready');
});

$('download').addEventListener('click', async () => {
  const token = ++state.token;
  const text = $('text').value.trim();
  if (!text) return;
  const chunks = splitText(text, 300);
  const voice = $('voice').value;
  const sam = SAM[voice];
  try {
    if (ESPEAK[voice]) {
      const blobs = [];
      for (let i = 0; i < chunks.length; i++) {
        status(chunks.length > 1 ? `Synthesizing ${i + 1}/${chunks.length}` : 'Synthesizing');
        blobs.push(await robotize(await espeakWav(chunks[i], voice), state.robot));
        if (token !== state.token) return;
      }
      const url = URL.createObjectURL(await stitch(blobs));
      const a = document.createElement('a');
      a.href = url; a.download = 'v1-tts.wav'; a.click();
      URL.revokeObjectURL(url);
      status('Ready');
      return;
    }
    if (sam) {
      if (useProxy()) {
        try {
          const blobs = [];
          for (let i = 0; i < chunks.length; i++) {
            status(chunks.length > 1 ? `Synthesizing ${i + 1}/${chunks.length}` : 'Synthesizing');
            blobs.push(await samFetch(chunks[i], sam));
            if (token !== state.token) return;
          }
          const url = URL.createObjectURL(await stitch(blobs));
          const a = document.createElement('a');
          a.href = url; a.download = 'v1-tts.wav'; a.click();
          URL.revokeObjectURL(url);
          status('Ready');
          return;
        } catch (e) { state.samProxyBad = true; }
      }
      // No usable proxy: can't read tetyys bytes cross-origin to stitch,
      // so open the WAV (browser downloads/plays it).
      window.open(samDirect(text.slice(0, 600), sam), '_blank', 'noopener');
      status(text.length > 600 ? 'Opened WAV (first part; a proxy enables stitching)' : 'Opened WAV');
      return;
    }
    const s = await session(voiceFor(text));
    if (token !== state.token) return;
    const blobs = [];
    for (let i = 0; i < chunks.length; i++) {
      status(chunks.length > 1 ? `Synthesizing ${i + 1}/${chunks.length}` : 'Synthesizing');
      blobs.push(await robotize(await s.predict(chunks[i]), state.robot));
      if (token !== state.token) return;
    }
    const url = URL.createObjectURL(await stitch(blobs));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'v1-tts.wav';
    a.click();
    URL.revokeObjectURL(url);
    status('Ready');
  } catch (e) {
    if (token === state.token) status('Error: ' + (e.message || e));
  }
});

// Local-only hooks for the headless test harness; never exposed in production.
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  window.__test = {
    session, robotize, espeakWav,
    setPreset: k => { state.preset = PRESETS[k]; },
    setPresetObj: o => { state.preset = o; },
    setRobot: v => { state.robot = v; }
  };
}
</script>
